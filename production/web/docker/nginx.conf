server {
    listen 80;
    server_name kythrastudio.bilgehan.biz localhost _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 105M;

    # Gzip compression for fast delivery over Cloudflare Tunnel
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Reverse proxy /api/* directly to the containerized GPU Production Backend (kythra-api:8000)
    location /api/ {
        proxy_pass http://kythra-api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
